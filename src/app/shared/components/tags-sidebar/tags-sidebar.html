<div class="tags-sidebar">
  <h3>Popular Tags</h3>
  <div class="tags-sidebar__content">
    @let tags = tags$ | async;

    @if (tags) {
      @if (tags.length > 0) {
        <app-tags [tags]="tags" [breakLines]="true" [clickable]="true" />
      } @else {
        <p class="home__empty">No tags are here... yet.</p>
      }
    } @else {
      <p class="home__loading">Loading tags...</p>
    }
  </div>
</div>
